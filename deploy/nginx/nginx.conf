server {
    listen 80;
    server_name avabid.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name avabid.localhost;

    ssl_certificate     /etc/nginx/certs/avabid.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/avabid.localhost-key.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Внутренний адрес бэкенда в сети Docker
        proxy_pass http://backend:3000; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        # Внутренний адрес фронтенда (Nginx внутри контейнера смотрит на 80 порт)
        proxy_pass http://frontend:80/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}