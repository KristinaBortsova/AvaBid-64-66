<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaBid - Восстановление пароля</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://utyklerfkkcbequrikil.supabase.co/storage/v1/object/public/avabid-images/2.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-overlay">
        <div class="recovery-card">
            <div class="recovery-header">
                <div class="header-left">
                    <img src="https://utyklerfkkcbequrikil.supabase.co/storage/v1/object/public/avabid-images/1.jpg" alt="AvaBid Logo" class="recovery-logo">
                    <h2>Восстановление пароля</h2>
                </div>
                <a href="login.html" class="close-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </a>
            </div>

            <div class="recovery-content">
                <div class="lock-icon-box">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>

                <div id="recovery-step-1" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <p class="recovery-text">Введите адрес электронной почты</p>
                    <form class="recovery-form" id="send-code-form">
                        <input type="email" class="recovery-input" placeholder="" required>
                        <button type="submit" class="recovery-btn" id="send-code-btn">Отправить код</button>
                    </form>
                </div>

                <div id="recovery-step-2" style="display: none; width: 100%;">
                    <div class="password-inputs-wrapper">
                        <div class="input-group">
                            <label for="new-password">Введите новый пароль</label>
                            <input type="password" id="new-password" class="recovery-input" placeholder="">
                        </div>
                        <div class="input-group">
                            <label for="confirm-password">Подтвердите пароль</label>
                            <input type="password" id="confirm-password" class="recovery-input" placeholder="">
                        </div>
                    </div>
                    <a href="profile.html" class="recovery-btn login-redirect-btn">Войти</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sendCodeForm = document.getElementById('send-code-form');
            const step1 = document.getElementById('recovery-step-1');
            const step2 = document.getElementById('recovery-step-2');

            if (sendCodeForm) {
                sendCodeForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    step1.style.display = 'none';
                    step2.style.display = 'flex';
                    step2.style.flexDirection = 'column';
                    step2.style.alignItems = 'center';
                });
            }
        });
    </script>
</body>
</html>
