        <main class="main-content">
            <header class="top-header">
                <h1>Создать лот</h1>
                <button class="bell-btn">
                    <svg width="76" height="71" viewBox="0 0 76 71" fill="none" xmlns="http://www.w3.org/2000/svg">
                     <path d="M38 3C57.5255 3 73 17.7398 73 35.5C73 53.2602 57.5255 68 38 68C18.4745 68 3 53.2602 3 35.5C3 17.7398 18.4745 3 38 3Z" fill="#E8EFE5" stroke="#839A88" stroke-width="6"/>

            <div class="about-container" style="flex-direction: column;">
                <h2 style="color: #5F6E63; font-size: 28px; text-transform: uppercase; margin-bottom: 30px;">Новый лот</h2>

                <form id="create-lot-form" style="display: flex; flex-direction: column; gap: 20px; max-width: 600px; width: 100%;">
                    <div class="input-group">
                        <label for="lot-name" style="color: #5F6E63; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block;">Название лота</label>
                        <input type="text" id="lot-name" required style="width: 100%; background: #E8EFE5; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-family: 'Alegreya Sans SC', sans-serif; color: #353F37; outline: none; box-sizing: border-box;">
                    </div>

                    <div class="input-group">
                        <label for="lot-description" style="color: #5F6E63; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block;">Описание</label>
                        <textarea id="lot-description" rows="4" required style="width: 100%; background: #E8EFE5; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-family: 'Alegreya Sans SC', sans-serif; color: #353F37; outline: none; box-sizing: border-box; resize: vertical;"></textarea>
                    </div>

                    <div class="input-group">
                        <label for="lot-category" style="color: #5F6E63; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block;">Категория</label>
                        <select id="lot-category" required style="width: 100%; background: #E8EFE5; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-family: 'Alegreya Sans SC', sans-serif; color: #353F37; outline: none; box-sizing: border-box;">
                            <option value="">Выберите категорию..</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="input-group">
                            <label for="lot-start-price" style="color: #5F6E63; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block;">Стартовая цена (₽)</label>
                            <input type="number" id="lot-start-price" min="1" step="1" required style="width: 100%; background: #E8EFE5; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-family: 'Alegreya Sans SC', sans-serif; color: #353F37; outline: none; box-sizing: border-box;">
                        </div>
                        <div class="input-group">
                            <label for="lot-step-min" style="color: #5F6E63; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block;">Минимальный шаг (₽)</label>
                            <input type="number" id="lot-step-min" min="1" step="1" required style="width: 100%; background: #E8EFE5; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-family: 'Alegreya Sans SC', sans-serif; color: #353F37; outline: none; box-sizing: border-box;">
                        </div>
                    </div>
                    <div class="input-group">
                       <label for="lot-duration" style="color: #5F6E63; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block;">Длительность аукциона</label>
                       <select id="lot-duration" required style="width: 100%; background: #E8EFE5; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-family: 'Alegreya Sans SC', sans-serif; color: #353F37; outline: none; box-sizing: border-box; cursor: pointer;">
                            <option value="1">1 час</option>
                            <option value="6">6 часов</option>
                            <option value="12">12 часов</option>
                            <option value="24" selected>1 день</option>
                            <option value="72">3 дня</option>
                            <option value="168">7 дней</option>
                       </select>
                    </div>
                    <div class="input-group">
                        <label for="lot-image" style="color: #5F6E63; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block;">URL изображения (необязательно)</label>
                        <input type="url" id="lot-image" placeholder="https://..." style="width: 100%; background: #E8EFE5; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-family: 'Alegreya Sans SC', sans-serif; color: #353F37; outline: none; box-sizing: border-box;">
                    </div>

                    <p id="create-lot-error" style="color: #c0392b; font-size: 14px; text-align: center; display: none;"></p>
                    <p id="create-lot-success" style="color: #5F6E63; font-size: 16px; text-align: center; display: none; font-weight: 700;"></p>

                    <button type="submit" class="recovery-btn" id="create-lot-submit" style="text-transform: uppercase; margin-top: 10px;">Опубликовать</button>
                </form>
            </div>
        </main>
    </div>

    <script src="../auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            // Загружаем категории
            const catSelect = document.getElementById('lot-category');
            try {
                const res = await fetch('http://localhost:3000/api/categories');
                const categories = await res.json();
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = cat.name;
                    catSelect.appendChild(opt);
                });
            } catch (e) {
                console.error('Не удалось загрузить категории', e);
            }

            // Обработка формы
            const form = document.getElementById('create-lot-form');
            const errorEl = document.getElementById('create-lot-error');
            const successEl = document.getElementById('create-lot-success');
            const submitBtn = document.getElementById('create-lot-submit');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.style.display = 'none';
                successEl.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Публикация...';

                const payload = {
                   name: document.getElementById('lot-name').value.trim(),
                 description: document.getElementById('lot-description').value.trim(),
                 startPrice: parseFloat(document.getElementById('lot-start-price').value),
                 stepMin: parseFloat(document.getElementById('lot-step-min').value),
                 categoryId: parseInt(catSelect.value),
                 imageUrl: document.getElementById('lot-image').value.trim() || null,
                 durationHours: parseInt(document.getElementById('lot-duration').value),
                };

                try {
                    const token = getToken();
                    const response = await fetch('http://localhost:3000/api/lots', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`,
                        },
                        body: JSON.stringify(payload),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Ошибка создания лота');
                    }

                    successEl.textContent = 'Лот успешно создан! Перенаправление...';
                    successEl.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = `lot.html?id=${data.lot.id}`;
                    }, 1200);

                } catch (err) {
                    errorEl.textContent = err.message;
                    errorEl.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Опубликовать';
                }
            });
        });
    </script>
